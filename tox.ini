[tox]
envlist =
    py311-{dj,djlts}-drf,
    py311-doctest
    flake8,

[testenv]
commands = pytest tests
deps =
    pytest
    mock
    six
    djlts: Django~=4.2
    dj: Django~=5.0
    drf: djangorestframework~=3.15

[testenv:flake8]
deps =
    flake8
commands = flake8 --filename=filternaut/\*.py

[testenv:py311-doctest]
deps = -rrequirements/docs.txt
commands = sphinx-build -b doctest docs _build
